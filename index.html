<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ladue Property Watch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!-- Leaflet map library (pinned version) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: summary strip, then a two-pane view — map on the left (top on phones), listing cards on the right */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#1b2620; --muted:#5d6b63; --line:#d9e0db;
  --accent:#2f5d47; --accent-soft:#e3ece6;
  --movein:#2f5d47; --land:#8a6a1f; --asis:#7a4a8c; --distressed:#a13a32;
  --warn:#a2650d; --bad:#a13a32; --warn-soft:#f6ead6; --bad-soft:#f4e0dd;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121815; --surface:#1a221e; --ink:#e4ebe6; --muted:#97a69d; --line:#2c3832;
  --accent:#7fbf9c; --accent-soft:#22332a;
  --movein:#7fbf9c; --land:#d8b25a; --asis:#c49ad4; --distressed:#e58a80;
  --warn:#e3a85a; --bad:#e58a80; --warn-soft:#3a2d18; --bad-soft:#3b2220; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:24px 40px;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(26px,4vw,38px)/1.05 var(--display);margin:4px 0 0;text-wrap:balance}
.updated{font:12px var(--mono);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{background:var(--surface);padding:10px 14px}
.stat b{display:block;font:600 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px/1 var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:13px var(--body);padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.panes{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
#map{height:calc(100vh - 230px);min-height:420px;border-radius:8px;border:1px solid var(--line);position:sticky;top:12px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
@media (max-width:900px){.panes{grid-template-columns:1fr}#map{position:static;height:360px;min-height:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;cursor:pointer;min-width:0}
.card.dim{opacity:.55}
.card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.photo{aspect-ratio:3/2;max-width:100%;background:var(--accent-soft);display:grid;place-items:center;color:var(--muted);font:12px var(--mono);position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;left:8px;font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:5px 7px;border-radius:4px;color:#fff}
.body{padding:12px 14px;display:grid;gap:8px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.addr{font:600 16px/1.25 var(--display);margin:0;overflow-wrap:anywhere}
.price{font:500 16px/1.2 var(--mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.price s{display:block;font-size:12px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:5px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.specs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:0}
.specs dt{font:10px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.specs dd{margin:0;font:500 13px/1.3 var(--body);font-variant-numeric:tabular-nums}
.note{margin:0;color:var(--muted);font-size:13px}
.links{display:flex;gap:12px;font:500 13px var(--body)}
.links a{color:var(--accent)}
.foot{font:11px var(--mono);color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.leaflet-popup-content{font:13px/1.4 var(--body)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Ladue School District · St. Louis County, MO</div>
      <h1>Ladue Property Watch</h1>
    </div>
    <div class="updated" id="updated">Loading…</div>
  </header>

  <section class="stats" aria-label="Summary">
    <div class="stat"><b id="s-active">–</b><small>Active</small></div>
    <div class="stat"><b id="s-new">–</b><small>New in 7 days</small></div>
    <div class="stat"><b id="s-cuts">–</b><small>Price cuts</small></div>
    <div class="stat"><b id="s-off">–</b><small>Pending / sold</small></div>
  </section>

  <div class="bar">
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    <div class="chips">
      <label class="chip" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="hideOff"> Hide pending/sold</label>
      <select id="sort" aria-label="Sort">
        <option value="new">Newest first</option>
        <option value="price-asc">Price, low to high</option>
        <option value="price-desc">Price, high to low</option>
        <option value="lot">Largest lot</option>
      </select>
    </div>
  </div>

  <div class="panes">
    <div id="map" role="region" aria-label="Map of listings"></div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
// ---- Constants ------------------------------------------------------------
// Category labels and their CSS color tokens (used for chips, photo tags and map pins)
const BUCKETS = {movein:"Move-in", land:"Land / teardown", asis:"As-is", distressed:"Distressed"};
const LADUE_HS = {lat:38.6394, lng:-90.3966}; // Ladue Horton Watkins High School (Wikipedia)

// ---- State ----------------------------------------------------------------
let rows = [];            // all listings from listings.json
let filter = "all";       // active category chip
let sortKey = "new";      // active sort
let hideOff = false;      // hide pending/sold toggle
const markers = {};       // listing id -> Leaflet marker

// Restore per-browser preferences (safe if storage is blocked)
try { const p = JSON.parse(localStorage.getItem("lpw") || "{}"); filter = p.filter || filter; sortKey = p.sortKey || sortKey; hideOff = !!p.hideOff; } catch (e) {}
const savePrefs = () => { try { localStorage.setItem("lpw", JSON.stringify({filter, sortKey, hideOff})); } catch (e) {} };

// ---- Helpers --------------------------------------------------------------
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const color = b => cssVar("--" + (BUCKETS[b] ? b : "movein"));
const money = n => typeof n !== "number" ? "—" : n >= 1e6 ? "$" + (n / 1e6).toFixed(3).replace(/0+$/, "").replace(/\.$/, "") + "M" : "$" + Math.round(n / 1e3) + "K";
const isOff = r => r.status === "pending" || r.status === "sold";
const isCut = r => typeof r.prevPrice === "number" && typeof r.price === "number" && r.prevPrice > r.price;
const daysAgo = d => { const t = Date.parse(d); return isNaN(t) ? Infinity : (Date.now() - t) / 864e5; };
// Straight-line distance in miles (haversine)
function miles(a, b) {
  const R = 3958.8, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// Small DOM builder: el("div", {class:"x"}, child1, "text")
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (v === undefined || v === null) continue; if (k === "class") n.className = v; else n.setAttribute(k, v); }
  for (const k of kids) if (k !== null && k !== undefined && k !== false) n.append(k);
  return n;
}

// ---- Map ------------------------------------------------------------------
const map = L.map("map", {scrollWheelZoom: true}).setView([38.65, -90.385], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
// Landmark: the high school, drawn as a small square so it reads differently from listing pins
L.marker([LADUE_HS.lat, LADUE_HS.lng], {
  icon: L.divIcon({className: "", html: '<div style="width:14px;height:14px;background:#1b2620;border:2px solid #fff;border-radius:2px"></div>', iconSize: [14, 14]})
}).addTo(map).bindTooltip("Ladue Horton Watkins HS");

// Round pin colored by category; hollow when pending/sold
function pinIcon(r) {
  const c = color(r.bucket), fill = isOff(r) ? "#ffffff" : c;
  return L.divIcon({className: "", iconSize: [18, 18],
    html: `<div style="width:18px;height:18px;border-radius:50%;background:${fill};border:3px solid ${c};box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>`});
}

// ---- Rendering --------------------------------------------------------------
function card(r) {
  const off = isOff(r);
  // Photo (loaded straight from the listing site) or a placeholder
  const ph = el("div", {class: "photo"});
  if (r.photo) {
    const img = el("img", {src: r.photo, alt: "Photo of " + r.address, loading: "lazy", referrerpolicy: "no-referrer"});
    img.onerror = () => { img.remove(); ph.prepend("No photo available"); };
    ph.append(img);
  } else ph.append("No photo yet");
  const tag = el("span", {class: "tag"}, BUCKETS[r.bucket] || "Listing");
  tag.style.background = color(r.bucket);
  ph.append(tag);

  // Price, with the previous price struck through on a cut
  const price = el("div", {class: "price"}, money(r.price));
  if (isCut(r)) price.append(el("s", {}, money(r.prevPrice)));

  // Status pills
  const pills = el("div", {class: "pills"});
  if (r.status && r.status !== "active") pills.append(el("span", {class: "pill " + (r.status === "pending" ? "warn" : "bad")}, r.status));
  if (isCut(r)) pills.append(el("span", {class: "pill"}, "Price cut"));
  if (r.elementary) pills.append(el("span", {class: "pill"}, r.elementary));
  if (r.lat && r.lng) pills.append(el("span", {class: "pill"}, miles(r, LADUE_HS).toFixed(1) + " mi to LHWHS"));
  if (r.unverified) pills.append(el("span", {class: "pill warn"}, r.unverified));

  // Specs row; lots show acreage only
  const land = r.bucket === "land" && !r.beds;
  const specs = el("dl", {class: "specs"});
  [["Beds", land ? "Lot" : r.beds], ["Baths", land ? "—" : r.baths],
   ["Sq ft", land ? "—" : (typeof r.sqft === "number" ? r.sqft.toLocaleString() : null)],
   ["Stories", land ? "—" : (r.stories || "").replace(" story", "")],
   ["Lot ac", typeof r.lot === "number" ? r.lot.toFixed(2) : null]
  ].forEach(([k, v]) => specs.append(el("div", {}, el("dt", {}, k), el("dd", {}, (v === null || v === undefined || v === "") ? "—" : String(v)))));

  // Outbound links: listing and Google Maps for the address
  const q = encodeURIComponent((r.address || "") + " St. Louis County MO");
  const links = el("div", {class: "links"},
    r.url ? el("a", {href: r.url, target: "_blank", rel: "noopener"}, "Listing ↗") : null,
    el("a", {href: "https://www.google.com/maps/search/?api=1&query=" + q, target: "_blank", rel: "noopener"}, "Google Maps ↗"));

  const c = el("article", {class: "card" + (off ? " dim" : ""), tabindex: "0", id: "card-" + r.id},
    ph,
    el("div", {class: "body"},
      el("div", {class: "top"}, el("h2", {class: "addr"}, r.address || "Unnamed"), price),
      pills, specs,
      r.note ? el("p", {class: "note"}, r.note) : null,
      links,
      el("div", {class: "foot"}, [r.source, r.firstSeen ? "found " + r.firstSeen : ""].filter(Boolean).join(" · "))));

  // Clicking a card centers the map on its pin
  const focus = () => { const m = markers[r.id]; if (m) { map.setView(m.getLatLng(), 15); m.openPopup(); } highlight(r.id); };
  c.addEventListener("click", e => { if (e.target.closest("a")) return; focus(); });
  c.addEventListener("keydown", e => { if (e.key === "Enter") focus(); });
  return c;
}

function highlight(id) {
  document.querySelectorAll(".card.active").forEach(n => n.classList.remove("active"));
  const n = document.getElementById("card-" + id);
  if (n) { n.classList.add("active"); n.scrollIntoView({block: "nearest", behavior: "smooth"}); }
}

function render() {
  // Summary numbers always reflect everything tracked
  document.getElementById("s-active").textContent = rows.filter(r => !isOff(r)).length;
  document.getElementById("s-new").textContent = rows.filter(r => daysAgo(r.firstSeen) <= 7).length;
  document.getElementById("s-cuts").textContent = rows.filter(isCut).length;
  document.getElementById("s-off").textContent = rows.filter(isOff).length;

  // Chips reflect the active filter
  document.querySelectorAll("#chips .chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.key === filter)));

  // Filter + sort the visible set
  const num = v => typeof v === "number" ? v : null;
  const sorters = {
    "new": (a, b) => String(b.firstSeen || "").localeCompare(String(a.firstSeen || "")),
    "price-asc": (a, b) => (num(a.price) ?? 1e12) - (num(b.price) ?? 1e12),
    "price-desc": (a, b) => (num(b.price) ?? -1) - (num(a.price) ?? -1),
    "lot": (a, b) => (num(b.lot) ?? -1) - (num(a.lot) ?? -1)
  };
  const view = rows.filter(r => (filter === "all" || r.bucket === filter) && !(hideOff && isOff(r))).sort(sorters[sortKey]);

  // Cards
  const list = document.getElementById("list");
  list.replaceChildren(...(view.length ? view.map(card) : [el("div", {class: "empty"}, "No listings match this filter.")]));

  // Pins: rebuild for the visible set and fit the map to them
  Object.values(markers).forEach(m => m.remove());
  for (const k in markers) delete markers[k];
  const pts = [];
  view.forEach(r => {
    if (typeof r.lat !== "number" || typeof r.lng !== "number") return;
    const m = L.marker([r.lat, r.lng], {icon: pinIcon(r), title: r.address}).addTo(map);
    m.bindPopup(`<b>${r.address}</b><br>${money(r.price)}${r.status && r.status !== "active" ? " · " + r.status : ""}`);
    m.on("click", () => highlight(r.id));
    markers[r.id] = m; pts.push([r.lat, r.lng]);
  });
  if (pts.length) map.fitBounds(L.latLngBounds(pts.concat([[LADUE_HS.lat, LADUE_HS.lng]])).pad(0.15), {maxZoom: 15});
}

// ---- Controls -------------------------------------------------------------
const chipBox = document.getElementById("chips");
[["all", "All"], ...Object.entries(BUCKETS)].forEach(([key, label]) => {
  const b = el("button", {class: "chip", type: "button"}, label);
  b.dataset.key = key;
  b.addEventListener("click", () => { filter = key; savePrefs(); render(); });
  chipBox.append(b);
});
const sortSel = document.getElementById("sort"), hideBox = document.getElementById("hideOff");
sortSel.value = sortKey; hideBox.checked = hideOff;
sortSel.addEventListener("change", () => { sortKey = sortSel.value; savePrefs(); render(); });
hideBox.addEventListener("change", () => { hideOff = hideBox.checked; savePrefs(); render(); });

// ---- Data load --------------------------------------------------------------
// cache-busting query so a fresh update shows up without a hard refresh
fetch("listings.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(data => {
    rows = Array.isArray(data.listings) ? data.listings : [];
    const t = Date.parse(data.updated);
    document.getElementById("updated").textContent = isNaN(t) ? "" : "Updated " + new Date(t).toLocaleString([], {dateStyle: "medium", timeStyle: "short"});
    render();
  })
  .catch(err => {
    document.getElementById("updated").textContent = "Couldn't load listings (" + err.message + ")";
    document.getElementById("list").replaceChildren(el("div", {class: "empty"}, "Listings failed to load. Reload the page to try again."));
  });
</script>
</body>
</html>
